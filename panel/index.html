<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151618" media="(prefers-color-scheme: dark)">
<title>Publicaciones · Bombero Flash</title>
<!--
  Panel de solo lectura. Lee cola.json en vivo desde GitHub (raw) y enseña, día a día y
  hora a hora, lo que sale en Instagram (y lo marcado para TikTok). No escribe nada.
  Para que algo de TikTok subido a mano aparezca aquí: añadir a cola.json una entrada con
  "redes": ["tiktok"] y "estado": "solo_tiktok" (el publicador ignora ese estado).
-->
<style>
:root{
  --bg:#f5f3ee; --card:#fffefb; --ink:#1b1c1e; --muted:#6c6f73; --soft:#8d9094;
  --line:#e4e0d7; --chip:#ece9e1; --accent:#2e5b4e; --accent-ink:#fff;
  --reel:#2e5b4e; --carrusel:#8a6431; --historia:#6d4f7f; --imagen:#4c5966;
  --ok:#2e6b45; --warn:#9a6a00; --bad:#a3362f; --now:#a3362f;
  --shadow:0 1px 2px rgba(30,25,15,.06),0 4px 14px rgba(30,25,15,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151618; --card:#1d1f22; --ink:#ecebe7; --muted:#a2a3a5; --soft:#7d7f82;
  --line:#2c2f33; --chip:#25282c; --accent:#7fb3a2; --accent-ink:#10201b;
  --reel:#7fb3a2; --carrusel:#d2a86a; --historia:#bb9ccc; --imagen:#9fb0c0;
  --ok:#7cc497; --warn:#e0b45a; --bad:#e58a83; --now:#e58a83;
  --shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(32px + env(safe-area-inset-bottom))}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* Cabecera */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:19px;letter-spacing:-.01em;font-weight:700}
.brand p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
.refresh{border:1px solid var(--line);background:var(--card);border-radius:999px;
  width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.refresh svg{width:18px;height:18px}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Tira de días */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{display:none}
.day{flex:none;scroll-snap-align:center;border:1px solid transparent;background:var(--chip);
  border-radius:14px;min-width:54px;padding:6px 8px 7px;text-align:center;cursor:pointer;line-height:1.15}
.day .wd{display:block;font-size:11px;color:var(--muted);text-transform:capitalize}
.day .dn{display:block;font-size:18px;font-weight:650;margin-top:1px}
.day .dots{display:flex;gap:3px;justify-content:center;height:5px;margin-top:4px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--soft);opacity:.7}
.day.past .dn{color:var(--muted)}
.day.today{border-color:var(--ink)}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel .wd{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.day.sel .dn{color:var(--bg)}
.day.sel .dots i{background:var(--bg)}

/* Resumen del día */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 6px;flex-wrap:wrap}
.dayhead h2{margin:0;font-size:22px;letter-spacing:-.015em;font-weight:700}
.dayhead .sum{color:var(--muted);font-size:13px}

/* Lista por horas */
.list{list-style:none;margin:6px 0 0;padding:0}
.row{display:grid;grid-template-columns:50px 1fr;gap:10px;position:relative}
.time{padding-top:13px;font-variant-numeric:tabular-nums;font-weight:650;font-size:15px}
.time small{display:block;font-weight:400;font-size:11px;color:var(--soft);margin-top:1px}
.row.done .time{color:var(--muted)}
.card{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:10px;margin:5px 0;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;
  transition:transform .12s ease}
.card:active{transform:scale(.985)}
.thumb{flex:none;width:66px;border-radius:10px;overflow:hidden;background:var(--chip);position:relative;align-self:flex-start}
.thumb.v{aspect-ratio:9/16}
.thumb.s{aspect-ratio:4/5}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .n{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;
  font-weight:600;border-radius:6px;padding:1px 5px}
.thumb .play{position:absolute;inset:auto 0 6px 0;margin:auto;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.55);display:grid;place-items:center}
.thumb .play::after{content:"";border-left:7px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;margin-left:2px}
.body{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px;padding-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:11.5px;font-weight:650;letter-spacing:.01em;padding:2px 8px;border-radius:999px;
  background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.st{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)}
.net{font-size:11.5px;color:var(--soft)}
.txt{margin:0;font-size:13.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.txt.empty{color:var(--soft);font-style:italic}
.row.done .card{opacity:.82}

.now{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:center;margin:4px 0;color:var(--now);
  font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.now i{height:2px;background:var(--now);border-radius:2px;position:relative}
.now i::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}

.empty-day{margin:28px 0;padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.note{margin:28px 0 0;padding:14px 16px;border-radius:14px;background:var(--chip);color:var(--muted);font-size:13px}
.note b{color:var(--ink)}
.err{margin:20px 0;padding:14px 16px;border-radius:14px;border:1px solid var(--bad);color:var(--bad);font-size:14px}
.skel{height:84px;border-radius:16px;background:var(--chip);margin:8px 0 8px 60px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* Ficha a pantalla completa */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
.sheet.open{display:flex}
.sbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.sbar .ttl{flex:1;min-width:0;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .ttl small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.close{border:0;background:var(--chip);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.close svg{width:16px;height:16px}
.sscroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.media{background:#0d0d0e;position:relative}
.media video{display:block;width:100%;max-height:72vh;background:#000}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:none;width:100%;max-height:72vh;object-fit:contain;scroll-snap-align:center;display:block}
.counter{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px}
.pager{display:flex;gap:5px;justify-content:center;padding:10px 0 0}
.pager i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pager i.on{background:var(--ink)}
.sinfo{padding:14px 16px 28px;max-width:720px;margin:0 auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:650;font-size:14px;
  padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.caption{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;line-height:1.5;margin:0}
.meta{margin:16px 0 0;color:var(--soft);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <h1>Publicaciones</h1>
        <p id="upd">Cargando la cola…</p>
      </div>
      <button class="refresh" id="refresh" aria-label="Actualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
    <nav class="days" id="days" aria-label="Días"></nav>
  </div>
</header>

<main class="wrap">
  <div id="out"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <p class="note"><b>TikTok:</b> lo que se programa a mano en TikTok Studio no pasa por esta cola, así que aquí solo sale lo marcado como TikTok. Si quieres verlo todo junto, se apunta en la cola como «solo TikTok» y aparece en su día y hora.</p>
</main>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sttl">
  <div class="sbar">
    <div class="ttl" id="sttl"></div>
    <button class="close" id="close" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sscroll" id="sbody"></div>
</section>

<script>
(() => {
  const REPO = "angelfernandezmartinez9-glitch/bomberoflash-publicador";
  const RAW = `https://raw.githubusercontent.com/${REPO}/main/`;
  // Los archivos se sirven desde GitHub Pages (tipo correcto para vídeo en iPhone); si falla, desde raw.
  const PAGES = new URL("../", location.href).href;
  const ZONA = "Europe/Madrid";
  const TIPOS = {reel:"Reel", carrusel:"Carrusel", historia:"Historia", imagen:"Imagen"};
  const ESTADOS = {
    publicado:["Publicado","ok"], publicando:["Publicándose","warn"], pendiente:["Programado",""],
    en_revision:["Pendiente de tu OK","warn"], error:["Error al publicar","bad"], solo_tiktok:["TikTok",""]
  };
  const $ = s => document.querySelector(s);
  let posts = [], sel = null, loadedAt = null;

  const media = p => p && /^https?:/.test(p) ? p : PAGES + p;
  const rawOf = p => RAW + p;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function nowMadrid() {
    const f = new Intl.DateTimeFormat("sv-SE", {timeZone:ZONA, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23"});
    const s = f.format(new Date()).replace(",", "");
    return {day:s.slice(0,10), time:s.slice(11,16), full:s.slice(0,16)};
  }
  function dateObj(day){ const [y,m,d] = day.split("-").map(Number); return new Date(Date.UTC(y,m-1,d,12)); }
  const fmt = (day, o) => new Intl.DateTimeFormat("es-ES", {timeZone:"UTC", ...o}).format(dateObj(day));
  function addDays(day, n){ const d = dateObj(day); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
  function redes(p){
    if (Array.isArray(p.redes)) return p.redes;
    return ["instagram"];
  }
  function hourOf(iso){ const m = /T(\d\d:\d\d)/.exec(iso || ""); return m ? m[1] : ""; }

  async function load(manual){
    $("#refresh").classList.add("spin");
    try {
      let res = await fetch(RAW + "cola.json?t=" + Date.now(), {cache:"no-store"}).catch(() => null);
      if (!res || !res.ok) res = await fetch(PAGES + "cola.json?t=" + Date.now(), {cache:"no-store"});
      if (!res.ok) throw new Error("HTTP " + res.status);
      const cola = await res.json();
      posts = (cola.posts || [])
        .filter(p => p.estado !== "archivado" && p.fecha)
        .map(p => ({...p, day:p.fecha.slice(0,10), time:p.fecha.slice(11,16)}))
        .sort((a,b) => a.fecha.localeCompare(b.fecha) || a.id.localeCompare(b.id));
      loadedAt = new Date();
      if (!sel) sel = pickInitial();
      render();
    } catch (e) {
      $("#out").innerHTML = `<div class="err">No he podido leer la cola (${esc(e.message)}). Comprueba la conexión y pulsa actualizar.</div>`;
      $("#upd").textContent = "Sin conexión con la cola";
    } finally {
      $("#refresh").classList.remove("spin");
    }
  }

  function pickInitial(){
    const h = decodeURIComponent(location.hash.slice(1));
    if (/^\d{4}-\d\d-\d\d$/.test(h)) return h;
    return nowMadrid().day;
  }

  function dayRange(){
    const today = nowMadrid().day;
    const days = new Set(posts.map(p => p.day));
    let first = addDays(today, -7), last = addDays(today, 6);
    for (const d of days){ if (d > last) last = d; }
    if (sel && sel < first) first = sel;
    if (sel && sel > last) last = sel;
    const out = [];
    for (let d = first; d <= last; d = addDays(d,1)) out.push(d);
    return out;
  }

  function renderDays(){
    const today = nowMadrid().day;
    const byDay = {};
    posts.forEach(p => (byDay[p.day] = (byDay[p.day]||0) + 1));
    const nav = $("#days");
    nav.innerHTML = dayRange().map(d => {
      const n = byDay[d] || 0;
      const cls = ["day", d === today ? "today" : "", d < today ? "past" : "", d === sel ? "sel" : ""].join(" ");
      const wd = d === today ? "Hoy" : d === addDays(today,1) ? "Mañana" : fmt(d, {weekday:"short"}).replace(".","");
      return `<button class="${cls}" data-day="${d}" aria-pressed="${d===sel}" aria-label="${fmt(d,{weekday:"long",day:"numeric",month:"long"})}, ${n} publicaciones">
        <span class="wd">${esc(wd)}</span><span class="dn">${+d.slice(8)}</span>
        <span class="dots">${"<i></i>".repeat(Math.min(n,5))}</span></button>`;
    }).join("");
    const s = nav.querySelector(".sel");
    if (s) s.scrollIntoView({inline:"center", block:"nearest"});
  }

  function thumb(p){
    const vert = p.tipo === "reel" || p.tipo === "historia";
    if (p.video){
      const t = p.portada_ms ? (p.portada_ms/1000).toFixed(2) : "0.5";
      return `<div class="thumb v"><video muted playsinline preload="metadata" src="${esc(media(p.video))}#t=${t}" data-raw="${esc(rawOf(p.video))}#t=${t}"></video><span class="play"></span></div>`;
    }
    const imgs = p.imagenes || [];
    if (!imgs.length) return `<div class="thumb ${vert?"v":"s"}"></div>`;
    return `<div class="thumb ${vert?"v":"s"}"><img loading="lazy" alt="" src="${esc(media(imgs[0]))}" data-raw="${esc(rawOf(imgs[0]))}">${imgs.length>1?`<span class="n">1/${imgs.length}</span>`:""}</div>`;
  }

  function statusLine(p){
    const [label, cls] = ESTADOS[p.estado] || [p.estado || "Programado", ""];
    let txt = label;
    if (p.estado === "publicado" && p.publicado_en){ const h = hourOf(p.publicado_en); if (h) txt += " a las " + h; }
    return `<span class="st ${cls}">${esc(txt)}</span>`;
  }

  function render(){
    renderDays();
    const n = nowMadrid();
    const list = posts.filter(p => p.day === sel);
    const count = {};
    list.forEach(p => count[p.tipo] = (count[p.tipo]||0)+1);
    const plural = {reel:["reel","reels"], carrusel:["carrusel","carruseles"], historia:["historia","historias"], imagen:["imagen","imágenes"]};
    const sum = Object.entries(count).map(([t,c]) => `${c} ${(plural[t]||[t,t])[c>1?1:0]}`).join(" · ");
    const title = sel === n.day ? "Hoy" : sel === addDays(n.day,1) ? "Mañana" : sel === addDays(n.day,-1) ? "Ayer" : "";
    let long = fmt(sel, {weekday:"long", day:"numeric", month:"long"});
    if (!title) long = long.charAt(0).toUpperCase() + long.slice(1);
    let html = `<div class="dayhead"><h2>${title ? esc(title)+" · " : ""}<span>${esc(long)}</span></h2><span class="sum">${esc(sum || "Nada programado")}</span></div>`;

    if (!list.length){
      html += `<div class="empty-day">${sel < n.day ? "Este día no salió nada por la cola." : "Todavía no hay nada programado para este día."}</div>`;
    } else {
      html += `<ul class="list">`;
      let nowShown = sel !== n.day;
      list.forEach((p, i) => {
        if (!nowShown && p.time > n.time){
          html += `<li class="now" aria-label="Ahora"><span>${n.time}</span><i></i></li>`; nowShown = true;
        }
        const prev = list[i-1];
        const sameTime = prev && prev.time === p.time;
        const done = p.estado === "publicado";
        const nets = redes(p).map(r => r === "tiktok" ? "TikTok" : "Instagram").join(" · ");
        const first = (p.texto || "").split("\n").find(l => l.trim()) || "";
        html += `<li class="row ${done?"done":""}">
          <div class="time">${sameTime ? "" : esc(p.time)}</div>
          <button class="card" data-id="${esc(p.id)}">
            ${thumb(p)}
            <div class="body">
              <div class="tags"><span class="tag" style="--c:var(--${esc(p.tipo)},var(--imagen))">${esc(TIPOS[p.tipo]||p.tipo)}</span>${statusLine(p)}</div>
              <p class="txt ${first?"":"empty"}">${first ? esc(first) : "Sin texto (solo imagen)"}</p>
              <span class="net">${esc(nets)}</span>
            </div>
          </button></li>`;
      });
      if (!nowShown) html += `<li class="now" aria-label="Ahora"><span>${n.time}</span><i></i></li>`;
      html += `</ul>`;
    }
    $("#out").innerHTML = html;
    fallbacks($("#out"));
    stamp();
  }

  // Si un archivo aún no está en Pages (recién añadido), se pide a raw.
  function fallbacks(root){
    root.querySelectorAll("img[data-raw],video[data-raw]").forEach(el => {
      el.addEventListener("error", () => { if (el.dataset.raw && el.src !== el.dataset.raw){ el.src = el.dataset.raw; delete el.dataset.raw; } }, {once:true});
    });
  }

  function stamp(){
    if (!loadedAt) return;
    const m = Math.round((Date.now() - loadedAt) / 60000);
    const pend = posts.filter(p => p.estado === "pendiente" && p.fecha >= nowMadrid().full).length;
    $("#upd").textContent = `${pend} programadas · actualizado ${m < 1 ? "ahora" : "hace " + m + " min"}`;
  }

  function open(id, push){
    const p = posts.find(x => x.id === id);
    if (!p) return;
    const nets = redes(p).map(r => r === "tiktok" ? "TikTok" : "Instagram").join(" · ");
    $("#sttl").innerHTML = `${esc(TIPOS[p.tipo]||p.tipo)} · ${esc(p.time)}<small>${esc(fmt(p.day,{weekday:"long",day:"numeric",month:"long"}))} · ${esc(nets)}</small>`;
    let m = "";
    if (p.video){
      m = `<div class="media"><video controls playsinline preload="metadata" src="${esc(media(p.video))}" data-raw="${esc(rawOf(p.video))}"></video></div>`;
    } else if ((p.imagenes||[]).length){
      const imgs = p.imagenes;
      m = `<div class="media"><div class="slides" id="slides">${imgs.map(s => `<img alt="" src="${esc(media(s))}" data-raw="${esc(rawOf(s))}">`).join("")}</div>${imgs.length>1?`<span class="counter" id="ctr">1/${imgs.length}</span>`:""}</div>${imgs.length>1?`<div class="pager" id="pager">${imgs.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}`;
    }
    const files = p.video ? [p.video] : (p.imagenes||[]);
    let acts = "";
    if (p.enlace) acts += `<a class="btn main" href="${esc(p.enlace)}" target="_blank" rel="noopener">Ver en Instagram ↗</a>`;
    if (files[0]) acts += `<a class="btn" href="${esc(media(files[0]))}" target="_blank" rel="noopener">${p.video ? "Abrir vídeo" : files.length > 1 ? "Abrir imágenes" : "Abrir imagen"}</a>`;
    const [label] = ESTADOS[p.estado] || [p.estado];
    let meta = `Estado: ${label}`;
    if (p.publicado_en) meta += ` · salió el ${p.publicado_en.slice(8,10)}/${p.publicado_en.slice(5,7)} a las ${hourOf(p.publicado_en)}`;
    if (p.palabra_linkdm) meta += ` · palabra clave ${p.palabra_linkdm}`;
    $("#sbody").innerHTML = `${m}<div class="sinfo"><div class="actions">${acts}</div>
      ${p.texto ? `<p class="caption">${esc(p.texto)}</p>` : `<p class="caption" style="color:var(--soft)">Sin texto: es una historia de solo imagen.</p>`}
      <p class="meta">${esc(meta)}</p></div>`;
    fallbacks($("#sbody"));
    const sl = $("#slides");
    if (sl){
      const imgs = p.imagenes;
      sl.addEventListener("scroll", () => {
        const i = Math.round(sl.scrollLeft / sl.clientWidth);
        const c = $("#ctr"); if (c) c.textContent = `${i+1}/${imgs.length}`;
        document.querySelectorAll("#pager i").forEach((d,k) => d.classList.toggle("on", k===i));
      }, {passive:true});
      // A veces "Abrir imágenes" debería abrir la que se está viendo
      const a = $("#sbody .btn:not(.main)");
      if (a && imgs.length > 1) sl.addEventListener("scroll", () => { const i = Math.round(sl.scrollLeft / sl.clientWidth); a.href = media(imgs[i] || imgs[0]); }, {passive:true});
    }
    $("#sheet").classList.add("open");
    $("#sbody").scrollTop = 0;
    document.body.style.overflow = "hidden";
    if (push) history.pushState({sheet:id}, "", location.hash || "#" + sel);
  }
  function close(fromPop){
    if (!$("#sheet").classList.contains("open")) return;
    $("#sheet").classList.remove("open");
    $("#sbody").querySelectorAll("video").forEach(v => v.pause());
    $("#sbody").innerHTML = "";
    document.body.style.overflow = "";
    if (!fromPop && history.state && history.state.sheet) history.back();
  }

  $("#days").addEventListener("click", e => {
    const b = e.target.closest(".day"); if (!b) return;
    sel = b.dataset.day; history.replaceState(null, "", "#" + sel); render();
    window.scrollTo({top:0});
  });
  $("#out").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) open(c.dataset.id, true); });
  $("#close").addEventListener("click", () => close(false));
  addEventListener("keydown", e => { if (e.key === "Escape") close(false); });
  addEventListener("popstate", () => close(true));
  $("#refresh").addEventListener("click", () => load(true));
  document.addEventListener("visibilitychange", () => { if (!document.hidden && loadedAt && Date.now() - loadedAt > 60000) load(); });
  setInterval(() => { if (!document.hidden) load(); }, 5 * 60000);
  setInterval(() => { if (!document.hidden && loadedAt) stamp(); }, 30000);
  load();
})();
</script>
</body>
</html>
