name: Publicar en Instagram y TikTok

on:
  # Activo. Mientras no esté el token de Instagram (CONFIGURAR.md), cada ejecución termina sin hacer nada.
  schedule:
    # Cada 15 minutos (minutos 2, 17, 32 y 47): un post de las 13:30 sale hacia las 13:32.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar, simular o comprobar"
        required: true
        default: "comprobar"
        type: choice
        options: [publicar, simular, comprobar]

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar lo que toque
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MAX_POR_EJECUCION: "1"
        run: python publicador/publicar.py --${{ github.event.inputs.modo || 'publicar' }}

      - name: Subir lo mismo a TikTok
        if: always()
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODO: ${{ vars.TIKTOK_MODO || 'borrador' }}
          TOKEN_OUT: ${{ runner.temp }}/tiktok.txt
        run: python publicador/tiktok.py --${{ github.event.inputs.modo || 'publicar' }}

      - name: Guardar la clave de TikTok si ha cambiado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          F="$RUNNER_TEMP/tiktok.txt"
          [ -s "$F" ] || exit 0
          NUEVO="$(cat "$F")"
          echo "::add-mask::$NUEVO"
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::TikTok ha dado una clave nueva y no hay secreto GH_PAT para guardarla. Vuelve a conectar TikTok (CONFIGURAR_TIKTOK.md)."
            exit 0
          fi
          printf '%s' "$NUEVO" | gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Clave de TikTok renovada y guardada."

      - name: Guardar el estado de la cola
        if: always()
        run: |
          if ! git diff --quiet -- cola.json; then
            git config user.name "publicador-bomberoflash"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cola.json
            git commit -m "Cola: actualizar estado de publicación"
            git pull --rebase
            git push
          fi
